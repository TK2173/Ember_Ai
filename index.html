<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d0b">
  <meta name="description" content="EMBER AI — интеллектуальный помощник">
  <title>EMBER AI</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      --bg: #100d0b;
      --panel: #19130f;
      --panel2: #211912;
      --gold: #e9a45d;
      --gold2: #f5c58c;
      --text: #f5eee7;
      --muted: #988779;
      --line: rgba(239,180,119,.13);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 5%, rgba(130,66,26,.19), transparent 38%),
        radial-gradient(ellipse at 100% 100%, rgba(103,48,19,.12), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    button, textarea { font: inherit; }
    button { color: inherit; }

    .app {
      min-height: 100vh;
      max-width: 1100px;
      margin: auto;
      padding: max(18px, env(safe-area-inset-top)) 18px
        max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    header {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 13px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 750;
      letter-spacing: 3px;
    }

    .brand-mark {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 17px var(--gold);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .5px;
    }

    .status::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #bd8957;
      margin-right: 7px;
      vertical-align: 1px;
    }

    .icon-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
      width: 38px;
      height: 38px;
      border-radius: 13px;
      cursor: pointer;
      color: var(--gold2);
      font-size: 18px;
    }

    .icon-btn:active, .mode:active, .send:active {
      transform: scale(.96);
    }

    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 220px minmax(0,1fr);
      gap: 22px;
      padding-top: 22px;
      min-height: 0;
    }

    aside {
      border: 1px solid var(--line);
      background: rgba(25,19,15,.72);
      border-radius: var(--radius);
      padding: 15px;
      height: fit-content;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }

    .side-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.8px;
      margin: 2px 2px 14px;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      border-radius: 13px;
      border: 1px solid rgba(233,164,93,.24);
      background: rgba(233,164,93,.08);
      color: var(--gold2);
      cursor: pointer;
      margin-bottom: 19px;
      text-align: left;
      font-size: 13px;
    }

    .history-item {
      width: 100%;
      display: block;
      padding: 11px 10px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #c5b5a7;
      text-align: left;
      cursor: pointer;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    .history-item.active,
    .history-item:hover {
      background: rgba(233,164,93,.09);
      color: var(--gold2);
    }

    main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 650px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(150deg, rgba(31,23,17,.86), rgba(17,14,12,.94));
      overflow: hidden;
      position: relative;
    }

    .welcome {
      text-align: center;
      padding: 55px 20px 25px;
      transition: opacity .25s ease;
    }

    .orb-wrap {
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 14px;
    }

    .orb {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at 34% 28%, #ffe1b6 0%, #e9a45d 13%,
        #a95626 38%, #3b1c13 68%, #160e0b 100%);
      box-shadow:
        0 0 28px rgba(229,142,72,.28),
        0 0 75px rgba(179,83,35,.17),
        inset -12px -15px 25px rgba(0,0,0,.65),
        inset 7px 5px 16px rgba(255,222,179,.32);
      animation: float 5s ease-in-out infinite;
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: -14px;
      border: 1px solid rgba(233,164,93,.15);
      border-radius: 50%;
      animation: halo 5s ease-in-out infinite;
    }

    .orb.thinking {
      animation: pulse 1.5s ease-in-out infinite;
    }

    .orb.thinking::after {
      animation: halo 1.2s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.09); filter: brightness(1.35); }
    }

    @keyframes halo {
      0%,100% { transform: scale(1); opacity: .35; }
      50% { transform: scale(1.17); opacity: .8; }
    }

    .welcome h1 {
      font-size: clamp(25px, 5vw, 36px);
      font-weight: 500;
      letter-spacing: 1px;
      margin: 0 0 10px;
    }

    .welcome h1 span { color: var(--gold2); }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .messages {
      flex: 1;
      padding: 20px clamp(14px, 4vw, 38px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 17px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 86%;
      width: fit-content;
      animation: appear .3s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.ai {
      align-self: flex-start;
    }

    .message-label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.2px;
      margin: 0 0 7px 4px;
    }

    .bubble {
      padding: 13px 16px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: linear-gradient(135deg, #85502e, #5a321f);
      color: #fff4e8;
      border: 1px solid rgba(255,204,151,.16);
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: rgba(255,255,255,.045);
      border: 1px solid var(--line);
      color: #eee2d7;
      border-bottom-left-radius: 5px;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 15px 17px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: var(--gold);
      border-radius: 50%;
      animation: dots 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    @keyframes dots {
      0%, 60%, 100% { opacity: .3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-5px); }
    }

    .thinking-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--gold);
      margin: 0 0 6px 4px;
    }

    .composer-area {
      padding: 12px clamp(12px, 3vw, 28px) 20px;
      border-top: 1px solid var(--line);
      background: rgba(12,10,9,.48);
    }

    .modes {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 0 13px;
      scrollbar-width: none;
    }

    .modes::-webkit-scrollbar { display: none; }

    .mode {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.025);
      padding: 8px 12px;
      color: #b9a99a;
      font-size: 11px;
      cursor: pointer;
      transition: .2s;
    }

    .mode.active {
      color: var(--gold2);
      background: rgba(233,164,93,.11);
      border-color: rgba(233,164,93,.35);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 9px;
      border: 1px solid rgba(233,164,93,.2);
      border-radius: 19px;
      background: #1b1511;
      padding: 9px;
      transition: border-color .2s, box-shadow .2s;
    }

    .input-box:focus-within {
      border-color: rgba(233,164,93,.55);
      box-shadow: 0 0 22px rgba(233,164,93,.07);
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 38px;
      max-height: 130px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 9px 5px;
      font-size: 14px;
      line-height: 1.45;
    }

    textarea::placeholder { color: #806f60; }

    .attach {
      width: 39px;
      height: 39px;
      border-radius: 13px;
      border: 0;
      background: transparent;
      color: #bda58e;
      font-size: 20px;
      cursor: pointer;
    }

    .send {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #f1bd82, #bd713d);
      color: #24150d;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .send:disabled, .attach:disabled {
      opacity: .4;
      cursor: default;
    }

    .file-name {
      color: var(--gold2);
      font-size: 11px;
      padding: 7px 4px 0;
      display: none;
    }

    .disclaimer {
      text-align: center;
      color: #74665b;
      font-size: 10px;
      padding-top: 10px;
    }

    .mobile-history {
      display: none;
    }

    @media (max-width: 700px) {
      .app { padding-left: 11px; padding-right: 11px; }
      .layout { display: block; padding-top: 12px; }
      aside { display: none; }
      .mobile-history { display: block; }
      main { min-height: calc(100dvh - 100px); border-radius: 22px; }
      .welcome { padding-top: 42px; }
      .message { max-width: 94%; }
      .status { display: none; }
    }

    @media (min-width: 701px) {
      .messages { min-height: 300px; }
    }

    .empty-history {
      color: #796b60;
      font-size: 12px;
      padding: 10px 4px;
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="brand-mark"></span>
      EMBER
    </div>
    <div class="header-right">
      <span class="status">AI ASSISTANT</span>
      <button class="icon-btn mobile-history" id="historyToggle" aria-label="История">☷</button>
      <button class="icon-btn" id="newChatTop" aria-label="Новый чат">＋</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <div class="side-heading">
        <span>ИСТОРИЯ</span>
        <span>⌁</span>
      </div>
      <button class="new-chat" id="newChat">＋ &nbsp; Новый диалог</button>
      <div id="historyList"></div>
    </aside>

    <main>
      <section class="welcome" id="welcome">
        <div class="orb-wrap">
          <div class="orb" id="orb"></div>
        </div>
        <h1>Добро пожаловать в <span>EMBER</span></h1>
        <p>Ваше пространство для идей, знаний и открытий.</p>
      </section>

      <section class="messages" id="messages"></section>

      <section class="composer-area">
        <div class="modes" id="modes">
          <button class="mode active" data-mode="Обычный режим">✦ Обычный</button>
          <button class="mode" data-mode="Поиск">⌕ Поиск</button>
          <button class="mode" data-mode="Фото">▧ Фото</button>
          <button class="mode" data-mode="Голос">◖ Голос</button>
          <button class="mode" data-mode="Файлы">▤ Файлы</button>
          <button class="mode" data-mode="Deep Think">◈ Deep Think</button>
        </div>

        <div class="input-box">
          <input type="file" id="fileInput" hidden>
          <button class="attach" id="attach" aria-label="Прикрепить файл">＋</button>
          <textarea id="prompt" rows="1" placeholder="Спросите что-нибудь..."></textarea>
          <button class="send" id="send" aria-label="Отправить">↑</button>
        </div>
        <div class="file-name" id="fileName"></div>
        <div class="disclaimer">EMBER AI · Ваш интеллектуальный помощник</div>
      </section>
    </main>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ВСТАВИМ СЮДА АДРЕС CLOUDFLARE WORKER, КОГДА ОН БУДЕТ ГОТОВ.
  const API_URL = "PASTE_WORKER_URL_HERE";

  const STORAGE_KEY = "ember_chats_v2";

  const $ = (id) => document.getElementById(id);
  const promptInput = $("prompt");
  const messagesEl = $("messages");
  const welcome = $("welcome");
  const orb = $("orb");
  const sendButton = $("send");
  const attachButton = $("attach");
  const fileInput = $("fileInput");
  const fileName = $("fileName");
  const historyList = $("historyList");

  let chats = loadChats();
  let currentChatId = null;
  let currentMode = "Обычный режим";
  let selectedFile = null;
  let busy = false;

  function loadChats() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }

  function saveChats() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    } catch (error) {
      console.warn("Не удалось сохранить историю:", error);
    }
  }

  function createChat() {
    const chat = {
      id: Date.now().toString(),
      title: "Новый диалог",
      messages: [],
      updated: Date.now()
    };

    chats.unshift(chat);
    currentChatId = chat.id;
    saveChats();
    renderChat();
    renderHistory();
    promptInput.focus();
  }

  function getCurrentChat() {
    return chats.find(chat => chat.id === currentChatId);
  }

  function renderHistory() {
    historyList.innerHTML = "";

    if (!chats.length) {
      const empty = document.createElement("div");
      empty.className = "empty-history";
      empty.textContent = "Здесь появятся ваши диалоги";
      historyList.appendChild(empty);
      return;
    }

    chats.forEach(chat => {
      const button = document.createElement("button");
      button.className = "history-item" +
        (chat.id === currentChatId ? " active" : "");
      button.textContent = chat.title || "Новый диалог";
      button.title = chat.title || "Новый диалог";
      button.addEventListener("click", () => {
        currentChatId = chat.id;
        renderChat();
        renderHistory();
        if (window.innerWidth <= 700) $("sidebar").style.display = "none";
      });
      historyList.appendChild(button);
    });
  }

  function addMessage(role, content) {
    const chat = getCurrentChat();
    if (!chat) return;

    chat.messages.push({ role, content });
    chat.updated = Date.now();

    if (role === "user" && chat.title === "Новый диалог") {
      chat.title = content.slice(0, 36) || "Новый диалог";
    }

    chats.sort((a, b) => b.updated - a.updated);
    saveChats();
    renderChat();
    renderHistory();
  }

  function renderChat() {
    messagesEl.innerHTML = "";
    const chat = getCurrentChat();
    const hasMessages = !!(chat && chat.messages.length);

    welcome.style.display = hasMessages ? "none" : "block";

    if (!chat) return;

    chat.messages.forEach(message => {
      const wrapper = document.createElement("div");
      wrapper.className = "message " +
        (message.role === "user" ? "user" : "ai");

      const label = document.createElement("div");
      label.className = "message-label";
      label.textContent = message.role === "user" ? "ВЫ" : "EMBER";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = message.content;

      wrapper.append(label, bubble);
      messagesEl.appendChild(wrapper);
    });

    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showThinking() {
    welcome.style.display = "none";
    orb.classList.add("thinking");

    const wrapper = document.createElement("div");
    wrapper.className = "message ai";
    wrapper.id = "thinkingMessage";

    const label = document.createElement("div");
    label.className = "thinking-label";
    label.textContent = "EMBER THINKING";

    const bubble = document.createElement("div");
    bubble.className = "bubble typing";
    bubble.innerHTML = "<span></span><span></span><span></span>";

    wrapper.append(label, bubble);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideThinking() {
    $("thinkingMessage")?.remove();
    orb.classList.remove("thinking");
  }

  function setBusy(value) {
    busy = value;
    sendButton.disabled = value;
    attachButton.disabled = value;
    promptInput.disabled = value;
    document.querySelectorAll(".mode").forEach(button => {
      button.disabled = value;
    });
  }

  function extractAnswer(data) {
    if (typeof data === "string") return data;
    if (data && typeof data.text === "string") return data.text;
    if (data && typeof data.response === "string") return data.response;

    const candidate = data?.candidates?.[0]?.content?.parts;
    if (Array.isArray(candidate)) {
      return candidate.map(part => part.text || "").join("");
    }

    throw new Error("Сервер вернул ответ в неизвестном формате.");
  }

  async function requestAI(chat) {
    if (!API_URL || API_URL === "PASTE_WORKER_URL_HERE") {
      throw new Error("Сервер ещё не подключён. Сначала нужно указать адрес Cloudflare Worker.");
    }

    const conversation = chat.messages.map(message => ({
      role: message.role === "ai" ? "assistant" : "user",
      content: message.content
    }));

    const response = await fetch(API_URL.replace(/\/$/, "") + "/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: conversation
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.error || data.message ||
        "Ошибка сервера: HTTP " + response.status
      );
    }

    return extractAnswer(data);
  }

  async function send() {
    if (busy) return;

    const text = promptInput.value.trim();
    if (!text) return;

    if (!currentChatId) createChat();

    const chat = getCurrentChat();
    if (!chat) return;

    let outgoingText = text;

    if (currentMode !== "Обычный режим") {
      outgoingText = "[" + currentMode + "]\n" + outgoingText;
    }

    if (selectedFile) {
      outgoingText += "\n[Прикреплённый файл: " + selectedFile.name +
        ". Файл пока не передаётся на сервер.]";
    }

    promptInput.value = "";
    promptInput.style.height = "38px";
    selectedFile = null;
    fileName.style.display = "none";

    addMessage("user", outgoingText);
    setBusy(true);
    showThinking();

    try {
      const answer = await requestAI(chat);

      hideThinking();

      if (!answer || !answer.trim()) {
        throw new Error("AI вернул пустой ответ.");
      }

      addMessage("ai", answer.trim());
    } catch (error) {
      hideThinking();
      addMessage(
        "ai",
        "Не удалось получить ответ.\n\n" +
        (error.message || "Проверьте подключение к серверу.")
      );
      console.error("EMBER API error:", error);
    } finally {
      setBusy(false);
      promptInput.focus();
    }
  }

  function selectMode(button) {
    document.querySelectorAll(".mode").forEach(item => {
      item.classList.remove("active");
    });
    button.classList.add("active");
    currentMode = button.dataset.mode;
  }

  document.querySelectorAll(".mode").forEach(button => {
    button.addEventListener("click", () => selectMode(button));
  });

  sendButton.addEventListener("click", send);

  promptInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });

  promptInput.addEventListener("input", () => {
    promptInput.style.height = "38px";
    promptInput.style.height =
      Math.min(promptInput.scrollHeight, 130) + "px";
  });

  attachButton.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files?.[0] || null;
    fileName.textContent = selectedFile
      ? "Прикреплено: " + selectedFile.name
      : "";
    fileName.style.display = selectedFile ? "block" : "none";
  });

  $("newChat").addEventListener("click", createChat);
  $("newChatTop").addEventListener("click", createChat);

  $("historyToggle").addEventListener("click", () => {
    const sidebar = $("sidebar");
    sidebar.style.display =
      sidebar.style.display === "block" ? "none" : "block";
  });

  if (chats.length) {
    currentChatId = chats[0].id;
  } else {
    createChat();
  }

  renderChat();
  renderHistory();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(error => {
        console.warn("Service Worker:", error);
      });
    });
  }
})();
</script>
</body>
</html>
