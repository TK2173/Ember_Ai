<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d0b">
<meta name="description" content="EMBER AI — пространство для идей, знаний и открытий">
<title>EMBER AI</title>
<link rel="manifest" href="./manifest.webmanifest">

<style>
:root {
  color-scheme: dark;
  --bg: #100d0b;
  --surface: #19130f;
  --surface-2: #211912;
  --gold: #e9a45d;
  --gold-light: #f5c58c;
  --text: #f5eee7;
  --muted: #988779;
  --line: rgba(239,180,119,.14);
  --sidebar: 250px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(130,66,26,.19), transparent 42%),
    radial-gradient(ellipse at 100% 100%, rgba(103,48,19,.12), transparent 40%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Segoe UI", sans-serif;
  overflow: hidden;
}

button, textarea {
  font: inherit;
}

button {
  color: inherit;
  touch-action: manipulation;
}

button:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.app {
  width: 100%;
  max-width: 1600px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  padding:
    max(14px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(14px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
}

.topbar {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  padding: 0 2px 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 17px;
  font-weight: 750;
  letter-spacing: 3.5px;
}

.brand-mark {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 18px rgba(233,164,93,.9);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.status {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1.3px;
}

.status::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 7px;
  border-radius: 50%;
  background: #bd8957;
  vertical-align: 1px;
}

.icon-button {
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,.025);
  color: var(--gold-light);
  font-size: 21px;
  cursor: pointer;
  transition: .2s ease;
}

.icon-button:active {
  transform: scale(.94);
}

.workspace {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0,1fr);
  gap: 20px;
  padding-top: 18px;
}

.sidebar {
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 17px 13px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(25,19,15,.76);
  overflow: hidden;
}

.sidebar-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 2px 5px 15px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1.8px;
}

.new-chat {
  width: 100%;
  min-height: 45px;
  padding: 11px 13px;
  margin-bottom: 16px;
  border: 1px solid rgba(233,164,93,.25);
  border-radius: 13px;
  background: rgba(233,164,93,.08);
  color: var(--gold-light);
  text-align: left;
  font-size: 13px;
  cursor: pointer;
}

.history-list {
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.history-item {
  display: block;
  width: 100%;
  min-height: 42px;
  padding: 11px 10px;
  margin-bottom: 4px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: #c5b5a7;
  text-align: left;
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}

.history-item.active {
  background: rgba(233,164,93,.10);
  color: var(--gold-light);
}

.history-empty {
  padding: 12px 5px;
  color: #796b60;
  font-size: 12px;
  line-height: 1.5;
}

.main-panel {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 26px;
  background: linear-gradient(150deg, rgba(31,23,17,.88), rgba(17,14,12,.96));
}

.welcome {
  flex-shrink: 0;
  padding: clamp(28px, 6vh, 65px) 20px 20px;
  text-align: center;
}

.orb-wrap {
  height: clamp(115px, 18vh, 165px);
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 13px;
}

.orb {
  width: clamp(88px, 11vw, 116px);
  height: clamp(88px, 11vw, 116px);
  position: relative;
  border-radius: 50%;
  background:
    radial-gradient(circle at 34% 27%, #ffe1b6 0%, #e9a45d 13%,
    #a95626 38%, #3b1c13 68%, #160e0b 100%);
  box-shadow:
    0 0 28px rgba(229,142,72,.30),
    0 0 75px rgba(179,83,35,.18),
    inset -12px -15px 25px rgba(0,0,0,.65),
    inset 7px 5px 16px rgba(255,222,179,.32);
  animation: orbFloat 5s ease-in-out infinite;
}

.orb::before, .orb::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.orb::before {
  inset: -8px;
  border: 1px solid rgba(233,164,93,.12);
}

.orb::after {
  inset: -16px;
  border: 1px solid rgba(233,164,93,.12);
  animation: halo 5s ease-in-out infinite;
}

.orb.thinking {
  animation: orbPulse 1.5s ease-in-out infinite;
}

.orb.thinking::after {
  animation: halo 1.2s ease-in-out infinite;
}

@keyframes orbFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes orbPulse {
  0%,100% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.09); filter: brightness(1.38); }
}

@keyframes halo {
  0%,100% { transform: scale(1); opacity: .35; }
  50% { transform: scale(1.16); opacity: .85; }
}

.welcome h1 {
  margin: 0 0 10px;
  font-size: clamp(25px, 3.5vw, 37px);
  font-weight: 500;
  letter-spacing: .5px;
}

.welcome h1 span {
  color: var(--gold-light);
}

.welcome p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}
